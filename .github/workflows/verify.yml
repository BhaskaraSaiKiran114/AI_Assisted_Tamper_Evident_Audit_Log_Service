name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: audit_m2_test
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: ephemeral-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_m2_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDIT_TEST_DB_URL: jdbc:postgresql://localhost:5432/audit_m2_test
      AUDIT_TEST_DB_USERNAME: audit_test
      AUDIT_TEST_DB_PASSWORD: ephemeral-ci-test-only
      AUDIT_TEST_DB_DESTRUCTIVE_OK: 'yes'
      AUDIT_TEST_CLUSTER_ROLES_OK: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash ./mvnw --batch-mode --no-transfer-progress clean
          python3 scripts/build-evidence.py --begin
          bash ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it,readiness verify
          python3 scripts/build-evidence.py --reference
      - name: Check patch whitespace
        run: git diff --check
      - name: Publish revision-bound test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/evidence/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/readiness/
            target/checkstyle-result.xml
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Audit runtime dependencies (fail closed on feed errors)
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/security-audit
          bash ./mvnw --batch-mode --no-transfer-progress \
            -Psecurity-audit -DskipTests \
            '-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz' \
            package dependency-check:check 2>&1 | tee target/security-audit/maven.log
      - name: Record security audit diagnostics
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/security-audit
          {
            printf 'Maven audit step: %s\n' "$AUDIT_OUTCOME"
            for report in dependency-check-report.html dependency-check-report.json; do
              if test -s "target/security-audit/$report"; then
                printf 'Report present: %s\n' "$report"
              else
                printf 'Report missing: %s (inspect the Maven audit log)\n' "$report"
              fi
            done
          } | tee target/security-audit/status.txt
          cat target/security-audit/status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Require complete security reports after a successful scan
        shell: bash
        run: |
          set -euo pipefail
          for report in dependency-check-report.html dependency-check-report.json; do
            if ! test -s "target/security-audit/$report"; then
              printf '::error::Successful audit did not produce %s\n' "$report"
              exit 1
            fi
          done
      - name: Publish dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: target/security-audit/
