name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: audit_m2_test
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: ephemeral-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_m2_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUDIT_TEST_DB_URL: jdbc:postgresql://localhost:5432/audit_m2_test
      AUDIT_TEST_DB_USERNAME: audit_test
      AUDIT_TEST_DB_PASSWORD: ephemeral-ci-test-only
      AUDIT_TEST_DB_DESTRUCTIVE_OK: 'yes'
      AUDIT_TEST_CLUSTER_ROLES_OK: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: bash ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it clean verify
      - name: Check patch whitespace
        run: git diff --check
