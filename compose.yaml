services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: auditlog
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: ${AUDIT_ADMIN_PASSWORD:?Set AUDIT_ADMIN_PASSWORD in .env}
      AUDIT_MIGRATION_PASSWORD: ${AUDIT_MIGRATION_PASSWORD:?Set AUDIT_MIGRATION_PASSWORD in .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - audit-postgres:/var/lib/postgresql/data
      - ./scripts/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./scripts/postgres/02-passwords.sql:/docker-entrypoint-initdb.d/02-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d auditlog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  audit-postgres:
