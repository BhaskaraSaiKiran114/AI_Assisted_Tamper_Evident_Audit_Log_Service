services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: auditlog
      POSTGRES_USER: auditlog
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - audit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditlog -d auditlog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  audit-postgres:
