spring:
  application:
    name: audit-log-service
  profiles:
    default: h2
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
    disable-swagger-default-url: true
  paths-to-match: /audit/**
audit:
  jwt:
    issuer: ${AUDIT_JWT_ISSUER:urn:audit-log:local}
    audience: ${AUDIT_JWT_AUDIENCE:audit-log-service}
    public-key-base64: ${AUDIT_JWT_PUBLIC_KEY_BASE64:}
  verification:
    max-concurrent: ${AUDIT_VERIFY_MAX_CONCURRENT:2}
  crypto:
    master-key-base64: ${AUDIT_MASTER_KEY_BASE64:}
  payload:
    protected-paths: ${AUDIT_PROTECTED_PATHS:/accountNumber,/personalIdentifier}
  query:
    cursor-key-base64: ${AUDIT_CURSOR_KEY_BASE64:}
